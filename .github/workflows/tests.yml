name: Tests

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-test-suite:
    name: Complete test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python and uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked test environment
        run: uv sync --locked --extra test

      - name: Check version transition
        run: uv run python scripts/check_version.py

      - name: Run complete test suite with branch coverage
        run: >-
          uv run pytest
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage/coverage.xml
          --cov-report=html:coverage/html

      - name: Record build identity
        if: always()
        shell: bash
        run: |
          mkdir -p coverage
          printf 'commit=%s\nrun_id=%s\nrun_number=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" \
            > coverage/build.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 30
