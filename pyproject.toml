[project]
name = "silent-relay"
version = "1.0.0"
description = "A self-hosted private notification service for trusted contacts."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "cryptography>=48.0.1",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "qrcode[pil]>=8",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
  "uuid6>=2025.0.1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-cov>=6",
]

[project.scripts]
silent-relay-scheduler = "app.scheduler.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true
