services:
  setup:
    build: .
    command: ["python", "-m", "app.setup"]
    environment:
      SILENTRELAY_CONFIG_DIR: /config
    volumes:
      - ./:/config
    profiles:
      - setup
    restart: "no"
  backup:
    build: .
    entrypoint: ["python", "-m", "app.backup_restore"]
    user: "0:0"
    volumes:
      - ./:/config:ro
      - silentrelay-data:/data:ro
    profiles:
      - maintenance
    restart: "no"
  restore:
    build: .
    entrypoint: ["python", "-m", "app.backup_restore"]
    user: "0:0"
    volumes:
      - ./:/config
      - silentrelay-data:/data
    profiles:
      - maintenance
    restart: "no"
  caddy:
    image: caddy:2-alpine
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    volumes:
      - silentrelay-data:/data
    networks:
      - backend
    restart: "no"
  web:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*", "--no-access-log"]
    env_file:
      - path: .env
        required: false
    volumes:
      - silentrelay-data:/data
    networks:
      - backend
      - outbound
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler.main"]
    env_file:
      - path: .env
        required: false
    volumes:
      - silentrelay-data:/data
    networks:
      - backend
      - outbound
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  silentrelay-data:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
    internal: true
  outbound:
