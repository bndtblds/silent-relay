services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    volumes:
      - silentrelay-data:/data
    restart: "no"
  web:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=127.0.0.1", "--no-access-log"]
    env_file: .env
    volumes:
      - silentrelay-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler.main"]
    env_file: .env
    volumes:
      - silentrelay-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  silentrelay-data:
